<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Dumb Units!</title>
  <meta name="description" content="Contact the Dumb Units! team.">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --bg:#f8f9fa;--panel:#ffffff;--text:#212529;--muted:#6c757d;
      --accent:#0ea5e9;--border:rgba(0,0,0,.1);--shadow:rgba(0,0,0,.12);
    }
    @media(prefers-color-scheme:dark){
      :root{--bg:#1a1a1a;--panel:#2b2b2b;--text:#f0f0f0;--muted:#b0b0b0;--accent:#38bdf8;--border:rgba(255,255,255,.12);--shadow:rgba(0,0,0,.35);}
    }
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:40px 20px;}
    .wrap{max-width:640px;margin:0 auto;text-align:center;}
    img{max-width:360px;width:90%;margin-bottom:20px;filter:drop-shadow(0 6px 18px var(--shadow));}
    form{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:28px;text-align:left;}
    label{display:block;margin-top:14px;font-weight:600;}
    input,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:16px;}
    textarea{resize:vertical;min-height:120px;}
    button{margin-top:20px;background:var(--accent);color:#fff;border:none;padding:12px 20px;border-radius:10px;font-weight:700;cursor:pointer;}
    button:hover{filter:brightness(.95);}
    a{color:var(--accent);text-decoration:none;}
  </style>
</head>
<body>
  <div class="wrap">
    <img src="banner_logo.png" alt="Dumb Units!">
    <h1>Contact Us</h1>
    <p style="color:var(--muted);margin-bottom:16px;">Have a question or suggestion? We'd love to hear from you.</p>
    <form name="contact" method="POST" data-netlify="true">
      <input type="hidden" name="form-name" value="contact">
      <label for="name">Name *</label>
      <input id="name" name="name" required>
      <label for="email">Email *</label>
      <input id="email" name="email" type="email" required>
      <label for="message">Message *</label>
      <textarea id="message" name="message" required></textarea>
      <button type="submit">Send</button>
    </form>
    <p style="margin-top:20px;"><a href="/index.html">← Back to Home</a></p>
  </div>
</body>
</html>
