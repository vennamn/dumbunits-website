<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dumb Units!</title>
  <meta name="description" content="Learn Celsius and Fahrenheit intuitively. Dumb Units! helps you understand temperature the way locals do—no math, no formulas.">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --bg:#f8f9fa;--text:#212529;--muted:#6c757d;
      --accent:#0ea5e9;--border:rgba(0,0,0,.1);--shadow:rgba(0,0,0,.12);
    }
    @media(prefers-color-scheme:dark){
      :root{--bg:#1a1a1a;--text:#f0f0f0;--muted:#b0b0b0;--accent:#38bdf8;--border:rgba(255,255,255,.12);--shadow:rgba(0,0,0,.35);}
    }
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
      background:var(--bg);color:var(--text);min-height:100vh;text-align:center;padding:48px 20px;
    }
    img{max-width:480px;width:90%;height:auto;filter:drop-shadow(0 6px 18px var(--shadow));margin-bottom:28px;}
    h1{font-size:clamp(32px,5vw,52px);font-weight:900;margin-bottom:12px;}
    p{max-width:600px;margin:0 auto 24px;color:var(--muted);font-size:18px;}
    a.btn{
      display:inline-block;padding:12px 20px;margin:6px;border-radius:10px;border:2px solid var(--accent);
      color:var(--accent);text-decoration:none;font-weight:700;transition:all .2s ease;
    }
    a.btn:hover{background:var(--accent);color:#fff;}
    footer{margin-top:48px;font-size:14px;color:var(--muted);}
    footer a{color:var(--muted);text-decoration:none;}
    footer a:hover{color:var(--accent);text-decoration:underline;}
  </style>
</head>
<body>
  <img src="banner_logo.png" alt="Dumb Units!">
  <h1>See it. Know it.</h1>
  <p>Learn Celsius and Fahrenheit the intuitive way—through visuals and real-world context. Dumb Units! builds true temperature fluency without formulas or memorization.</p>
  <a href="/privacy.html" class="btn">Privacy & Terms</a>
  <a href="/contact.html" class="btn">Contact</a>
  <footer><p>© 2025 KeepAddIt Works, LLC</p></footer>
</body>
</html>
